<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cronômetro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--responsável em exibir o tem formado por horas; minutos; segundos-->>
  <div class="container">
    <h1>CRONÔMETRO</h1>
    <div id="display">00:00:00</div>
    <br>
    <div class="buttons"> 
      <button onclick="start()">Iniciar</button>
      <button onclick="pause()">Pausar</button>
      <button onclick="reset()">Resetar</button>
    </div>
  </div>

  <!-- Som do clique -->
  <audio id="clickSound" src="sounds/clique1.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
